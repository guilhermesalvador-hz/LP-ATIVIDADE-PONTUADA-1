<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aizen Clock</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="center">
        <div class="painel">
            <h2>Aizen</h2>
            
            <div class="relogio-container">
                <span id="horas">00</span>
                <span class="dois-pontos">:</span>
                <span id="minutos">00</span>
                <span class="dois-pontos">:</span>
                <span id="segundos">00</span>
            </div>
            
            <div class="data-container">
                <div class="bloco-data">
                    <small>DIA</small>
                    <span id="dia">00</span>
                </div>
                <div class="bloco-data">
                    <small>MÊS</small>
                    <span id="mes">00</span>
                </div>
                <div class="bloco-data">
                    <small>ANO</small>
                    <span id="ano">0000</span>
                </div>
            </div>
            
            <div class="texto-box">
                <span id="mensagem">"Yokoso, watashi no Soul Society"</span>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
